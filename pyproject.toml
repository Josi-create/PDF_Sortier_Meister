[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-sortier-meister"
version = "0.23.0"
description = "Ein intelligentes Programm zum Sortieren und Umbenennen von gescannten PDF-Dokumenten"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.10"
authors = [
    {name = "Josi-create"}
]
keywords = ["pdf", "sorting", "ocr", "machine-learning", "document-management"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
    "Topic :: Utilities",
]

dependencies = [
    "PyQt6>=6.5.0",
    "PyMuPDF>=1.23.0",
    "pytesseract>=0.3.10",
    "scikit-learn>=1.3.0",
    "SQLAlchemy>=2.0.0",
    "python-dateutil>=2.8.0",
    "watchdog>=3.0.0",
    "numpy>=1.24.0",
    # Dokumentensuche (src/search): Outlook-Mails, Word 97-2003, Excel 97-2003, MCP-Server
    "extract-msg>=0.50.0",
    "olefile>=0.46",
    "xlrd>=2.0.0",
    "mcp>=2.0.0",
]

[project.optional-dependencies]
llm = [
    "anthropic>=0.18.0",
    "openai>=1.12.0",
]
# Browser-Oberflaeche der Dokumentensuche (Einstellungen -> Suche, standardmaessig aus)
suche-web = [
    "flask>=3.0.0",
    "waitress>=3.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-qt>=4.2.0",
    "pyinstaller>=6.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    # Build-Zeit-Abhaengigkeit von scripts/prepare_tesseract.py (DLL-Analyse)
    "pefile>=2023.2.7; sys_platform == 'win32'",
    # erzeugt .xls-Testdateien fuer die Dokumentensuche
    "xlwt>=1.3.0",
]
all = [
    "pdf-sortier-meister[llm,dev,suche-web]",
]

[project.urls]
Homepage = "https://github.com/Josi-create/PDF_Sortier_Meister"
Repository = "https://github.com/Josi-create/PDF_Sortier_Meister"
Issues = "https://github.com/Josi-create/PDF_Sortier_Meister/issues"

[project.gui-scripts]
pdf-sortier-meister = "src.main:main"

[project.scripts]
# Hintergrunddienst der Dokumentensuche: Indexierung, MCP-Server, Web, Kommandozeile
pdfsm-dienst = "src.search.dienst:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"*" = ["*.png", "*.ico", "*.json", "*.html"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
